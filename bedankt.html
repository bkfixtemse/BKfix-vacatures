<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bedankt voor je sollicitatie — BKfix</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --black: #1a1a18; --white: #ffffff; --text: #2c2c2a; --muted: #6b6b66; --border: #e4e2db; --tag-bg: #f0ede6; }
    body { font-family: 'Poppins', sans-serif; background: #fff; color: var(--text); line-height: 1.7; min-height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }

    .topbar { background: var(--black); color: rgba(255,255,255,0.75); font-size: 0.78rem; padding: 8px 40px; display: flex; align-items: center; justify-content: space-between; }
    .topbar a { color: rgba(255,255,255,0.75); transition: color 0.15s; }
    .topbar a:hover { color: #fff; }
    .topbar-left { display: flex; align-items: center; gap: 6px; }
    .topbar-right { display: flex; align-items: center; gap: 20px; }

    .main-nav { background: #fff; border-bottom: 1px solid var(--border); padding: 0 40px; display: flex; align-items: center; justify-content: space-between; height: 80px; }
    .nav-logo img { height: 64px; width: auto; display: block; filter: invert(1); }
    .nav-logo-text { font-weight: 700; font-size: 1.5rem; color: var(--black); }

    .content { flex: 1; display: flex; align-items: center; justify-content: center; padding: 80px 40px; }
    .content-inner { max-width: 560px; text-align: center; }

    .check { width: 72px; height: 72px; background: var(--tag-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 32px; }
    .check svg { width: 36px; height: 36px; stroke: var(--black); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 16px; line-height: 1.2; }
    p { font-size: 1rem; color: var(--muted); margin-bottom: 36px; }

    .btn { display: inline-block; background: var(--black); color: #fff; font-family: 'Poppins', sans-serif; font-size: 0.9rem; font-weight: 600; padding: 14px 32px; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.8; }

    footer { background: var(--black); color: rgba(255,255,255,0.4); font-size: 0.78rem; text-align: center; padding: 20px 40px; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81 19.79 19.79 0 01.26 1.22 2 2 0 012.24.01h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.91a16 16 0 006.16 6.16l1.07-.66a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
    <a href="tel:+32491767372">+32 (0) 491 76 73 72</a>
  </div>
  <div class="topbar-right">
    <a href="https://bkfix.be/contact/">Contact</a>
  </div>
</div>

<nav class="main-nav">
  <a class="nav-logo" href="/">
    <img src="logo-bkfix.png" alt="BKfix" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
    <span class="nav-logo-text" style="display:none">BKfix</span>
  </a>
</nav>

<div class="content">
  <div class="content-inner">
    <div class="check">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1>Bedankt voor je sollicitatie!</h1>
    <p>We hebben je gegevens goed ontvangen en nemen zo snel mogelijk contact met je op. We kijken ernaar uit om kennis te maken.</p>
    <a class="btn" href="/">← Terug naar vacatures</a>
  </div>
</div>

<footer>
  <p>&copy; 2025 BKfix — Krijgsbaan 172, 9140 Temse</p>
</footer>

</body>
</html>
